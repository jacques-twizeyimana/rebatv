# nginx site for rebaTV: public traffic on :80/:443 -> Next.js on 127.0.0.1:3000.
#
#   sudo mkdir -p /var/cache/nginx   # parent of proxy_cache_path below; nginx won't create it
#   sudo cp deploy/nginx/rebatv.conf /etc/nginx/sites-available/rebatv
#   sudo ln -s /etc/nginx/sites-available/rebatv /etc/nginx/sites-enabled/rebatv
#   sudo nginx -t && sudo systemctl reload nginx
#
# Replace server_name with your domain (or `_` to answer on the bare IP), then run
#   sudo certbot --nginx -d rebatv.bugufi.link --redirect
# which adds the HTTPS (443) server block and the HTTP -> HTTPS redirect to this file.

# Micro-cache for the HLS playlist proxy: viewers of the same channel share one upstream fetch
# every ~2 s. (This file is included inside nginx's http {} block.)
proxy_cache_path /var/cache/nginx/rebatv-hls levels=1:2 keys_zone=rebatv_hls:10m max_size=100m inactive=10m use_temp_path=off;

upstream rebatv_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name rebatv.bugufi.link;

    client_max_body_size 1m;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml application/vnd.apple.mpegurl;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    # Overwrite (don't append): the /sandberg login rate limit keys on this, so clients must not
    # be able to spoof it.
    proxy_set_header X-Forwarded-For $remote_addr;

    # Internal endpoint for deploy.sh; not public.
    location = /healthz {
        return 404;
    }

    location /hls/ {
        proxy_pass http://rebatv_app;
        proxy_cache rebatv_hls;
        proxy_cache_key $request_uri;        # includes ?u=…&s=… for nested playlists
        proxy_cache_valid 200 2s;
        proxy_cache_valid 403 404 10s;
        proxy_cache_lock on;                 # concurrent misses wait for a single fetch
        proxy_cache_use_stale updating error timeout;
        add_header X-Cache $upstream_cache_status;
    }

    # Hashed build assets: Next already sends `immutable` cache headers for these.
    location /_next/static/ {
        proxy_pass http://rebatv_app;
    }

    location / {
        proxy_pass http://rebatv_app;
        # Let streamed (partially prerendered) pages reach the browser as they render.
        proxy_buffering off;
    }
}
